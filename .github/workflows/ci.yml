name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Validate plugin manifests and skill structure
        run: python3 scripts/validate.py

      - name: Import audit (stdlib-only, vendored skill)
        run: |
          python3 - <<'PY'
          import ast, sys
          from pathlib import Path
          STDLIB = sys.stdlib_module_names
          ROOT = Path("skills/corkboard/script")
          LOCAL = {p.stem for p in ROOT.glob("*.py")}
          bad = []
          for f in ROOT.glob("*.py"):
              tree = ast.parse(f.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module.split(".")[0]] if node.module else []
                  else:
                      continue
                  for n in names:
                      if n not in STDLIB and n not in LOCAL:
                          bad.append(f"{f.name}: {n}")
          if bad:
              raise SystemExit("non-stdlib imports: " + ", ".join(bad))
          print("import audit OK")
          PY

      - name: Smoke-test the vendored CLI (help + no-token guard)
        run: |
          set -e
          cd skills/corkboard
          env -u CORKBOARD_TOKEN python3 script/corkboard.py me > /tmp/out.txt 2>&1 && rc=0 || rc=$?
          grep -q "CORKBOARD_TOKEN" /tmp/out.txt || { echo "expected missing-token error, got:"; cat /tmp/out.txt; exit 1; }
          echo "no-token guard OK"
