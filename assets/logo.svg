<?xml version="1.0" encoding="UTF-8"?>
<!-- Corkboard orbit mark — BoldBlack Semiotic Standard BBS-001 REV C.
     Tile = product identity; orbit ring = the shared record; satellite = the agent.
     The background is fully transparent: the mark is the blue tile outline, the
     blue orbit ring and the orange satellite, nothing else. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <rect x="4" y="4" width="24" height="24" rx="7" fill="none" stroke="#4a9bf5" stroke-width="2.5"/>
  <circle cx="16" cy="16" r="6.2" fill="none" stroke="#4a9bf5" stroke-width="2.4"/>
  <circle cx="20.6" cy="11.4" r="2.3" fill="#F0A040"/>
</svg>
